[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "AlphaBrain"
authors = [
]
description = "AlphaBrain"
version = "1.0.1"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vision-language-actions models", " robotic manipulation", "multimodal pretraining", "robot learning", "generative models"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
"Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]
sagemaker = [
    "boto3",
    "sagemaker"
]


[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "tests",         # test directory
    "tests.*",
    "build",         # local wheel/build artifacts
    "build.*",
    "cache",         # cache directory
    "playground",
    "results",       # result directory
    "checkpoints",   # model checkpoint
    "scripts",       # script directory
    "eval",          # evaluation related directory
    ".vscode",       # VS Code configuration directory
    "*.egg-info",    # egg-info metadata directory
    "**.log",         # log file
    "*.tmp",         # temporary file
    "*.bak",         # backup file
    "**__pycache__**",   # Python cache directory
    "*.pyc",         # compiled Python file
    "*.pyo",          # optimized Python file

]

[tool.setuptools.package-data]
alphabrain_ui = ["registry/*.yaml", "migrations/**/*.py", "migrations/*.mako"]

[tool.black]
line-length = 121
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"alphabrain_ui/app.py" = ["B008", "RUF001"]  # FastAPI Depends and intentional Chinese UI punctuation.
"alphabrain_ui/dependencies.py" = ["B008"]
"alphabrain_ui/capabilities.py" = ["RUF001"]  # Intentional Chinese UI punctuation.
"alphabrain_ui/configuration.py" = ["RUF001"]
"alphabrain_ui/deployment_preflight.py" = ["RUF001"]
"alphabrain_ui/deployment_registry.py" = ["RUF001"]
"alphabrain_ui/preflight.py" = ["RUF001"]
